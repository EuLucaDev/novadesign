[package]
name = "craft-pdf"
description = "Shared optional PDF writing primitives for Nova Foods apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
write = ["dep:krilla", "dep:thiserror"]
write-pdf = ["write", "krilla/pdf"]

[dependencies]
krilla = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
hayro-syntax = "=0.7.2"
hayro-interpret = { version = "=0.7.0", default-features = false }
hayro-cmap = "=0.1.0"
kurbo = "0.13"
ttf-parser = "=0.25.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
