[workspace]
exclude = ["vendor"]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/novadesign", "apps/novadesign-cli", "xtask"]

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/EuLucaDev/novadesign"

[workspace.dependencies]
# Shared writer; the immutable revision must be published before this consumer.
craft-pdf = { path = "vendor/novafoods-libs-c3487320b2/crates/pdf", default-features = false }
# internal
novadesign-geom = { path = "crates/geom" }
novadesign-color = { path = "crates/color" }
novadesign-doc = { path = "crates/doc" }
novadesign-fonts = { path = "crates/fonts" }
novadesign-compose = { path = "crates/compose" }
novadesign-images = { path = "crates/images" }
novadesign-render = { path = "crates/render" }
novadesign-pdf = { path = "crates/pdf" }
novadesign-idml = { path = "crates/idml" }
novadesign-epub = { path = "crates/epub" }
novadesign-pptx = { path = "crates/pptx" }
novadesign-textimport = { path = "crates/textimport" }
novadesign-format = { path = "crates/format" }
novadesign-tools = { path = "crates/tools" }
novadesign-engine = { path = "crates/engine" }
novadesign-ui-egui = { path = "crates/ui-egui" }
novadesign-mcp = { path = "crates/mcp" }
novadesign-testkit = { path = "crates/testkit" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-script = "0.5"
unicode-bidi-mirroring = "0.4"
unicode-segmentation = "1"
caseless = "0.2"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
fancy-regex = "0.19.2"
tempfile = "3"
same-file = "1.0.6"

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
vello_cpu = "0.2"
vello_common = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
# CMYK TIFF samples for PDF export (`image` decodes them to RGB); the version `image` uses.
tiff = "0.11"
# SVG (same usvg as krilla-svg).
resvg = { version = "0.47", default-features = false, features = ["text"] }
krilla-svg = "=0.8.1"
# Boolean operations on Bézier paths (Pathfinder).
flo_curves = "0.8"
# QR codes (Object › Generate QR Code); MIT.
qrcodegen = "1.8"
hayro = "0.7"
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }
# INDD/INDT → IDML conversion for File › Open: EuLucaDev/indd-utils, tracking its main branch
# (MIT OR Apache-2.0, no dependencies, builds for wasm).
indd = { path = "vendor/indd-utils-7f3060e5bc" }

# Which paths stored in documents may be followed (novafoods-libs).
craft-docpath = { path = "vendor/novafoods-libs-82a24b006e/crates/docpath" }
# Atomic file replacement for saves and exports (novafoods-libs).
nova-atomic = { path = "vendor/novafoods-libs-e9546e191d/crates/atomic" }
# File › Print through the system print spooler (novafoods-libs).
nova-print = { path = "vendor/novafoods-libs-d991bf6792/crates/print" }

# ICC colour management: working spaces, transforms, black point compensation (novafoods-libs).
nova-cms = { path = "vendor/novafoods-libs-e9546e191d/crates/cms" }

# ui
# Shared frontend components; keep this dependency above the engine boundary.
nova-ui = { path = "vendor/novafoods-libs-5c874d51ee/crates/ui", features = ["serde"] }
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# Opt-in cancelable macOS termination on the pinned winit 0.30 line.
[patch.crates-io]
winit = { git = "https://github.com/skylartaylor/winit.git", rev = "3d51077fd1a966f84df9ef287839dc84fd5b4ca7" }
krilla = { path = "vendor/novafoods-libs-c3487320b2/vendor/krilla" }
# The hayro crates from novapdf's vendor/ directory, with the patches its README lists.
hayro = { path = "vendor/novapdf-b5467d93a0/vendor/hayro" }
hayro-interpret = { path = "vendor/novapdf-b5467d93a0/vendor/hayro-interpret" }
hayro-syntax = { path = "vendor/novapdf-b5467d93a0/vendor/hayro-syntax" }
hayro-jbig2 = { path = "vendor/novapdf-b5467d93a0/vendor/hayro-jbig2" }
