[package]
name = "novadesign-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NovaDesign engine: session, documents, history, selection, command registry, tool hosting"

[lints]
workspace = true

[dependencies]
nova-print = { workspace = true }
novadesign-images = { workspace = true }
novadesign-geom = { workspace = true }
novadesign-color = { workspace = true }
novadesign-doc = { workspace = true }
novadesign-fonts = { workspace = true }
novadesign-compose = { workspace = true }
novadesign-render = { workspace = true }
novadesign-format = { workspace = true }
novadesign-epub = { workspace = true }
novadesign-textimport = { workspace = true }
novadesign-pdf = { workspace = true }
novadesign-tools = { workspace = true }
novadesign-idml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
quick-xml = { workspace = true }
caseless = { workspace = true }
unicode-segmentation = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = { workspace = true }

[dev-dependencies]
novadesign-fonts = { workspace = true, features = ["testing"] }
zip = { workspace = true }
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
kurbo = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
