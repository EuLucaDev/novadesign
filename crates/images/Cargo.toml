[package]
name = "novadesign-images"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NovaDesign placed-graphic decoding: raster formats (PNG, JPEG, GIF, WebP, TIFF, BMP, PSD) and SVG"

[lints]
workspace = true

[dependencies]
novadesign-color = { workspace = true }
novadesign-fonts = { workspace = true }
image = { workspace = true }
tiff = { workspace = true }
resvg = { workspace = true }
log = { workspace = true }
nova-cms = { workspace = true }
zune-core = { version = "0.5", default-features = false }
zune-jpeg = "0.5"

[dev-dependencies]
novadesign-fonts = { workspace = true, features = ["testing"] }
